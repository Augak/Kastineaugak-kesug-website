name: Build review package
on:
  push:
    branches: [site-refresh]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /Kastineaugak-kesug-website/
      - uses: actions/upload-artifact@v4
        with:
          name: kastineaugak-review-build
          path: dist
          retention-days: 14
